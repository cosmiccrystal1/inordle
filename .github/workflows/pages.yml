name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir dist
          cp index.html style.css app.js theme.js game.js trails.js config.js README.md dist/
          cp -r assets dist/assets
          mkdir dist/data
          cp data/words.json data/DICTIONARY-LICENSE data/BLOCKLIST-LICENSE dist/data/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
